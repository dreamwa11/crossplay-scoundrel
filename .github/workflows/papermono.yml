# Builds CrossPlay + Scoundrel for the M5Stack PaperMono / PaperMono-Lite.
#
# Every push to main: host tests for Scoundrel, then the release firmware.
# The images are attached to the run as an artifact (Actions -> the run -> Artifacts).
#
# A tag like v1.15.1: the same build, published as a GitHub release. The
# device's Settings -> Check for updates reads this repository's latest release
# and installs firmware-papermono.bin from it, so the tag must be a higher
# version than the one on the device.
name: PaperMono firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v6

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Scoundrel rules tests
        run: ./host-tests/scoundrel/run.sh

      - name: Build the PaperMono release image
        run: pio run -e gh_release_papermono

      - name: Merge the full image and check it
        run: |
          set -e
          IMG=.pio/build/gh_release_papermono
          VERSION=$(sed -n '/^\[crossplay\]/{n;s/^version = //p}' platformio.ini)
          mkdir -p dist
          ~/.platformio/penv/bin/python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 \
            merge-bin --format raw -o "dist/crossplay-scoundrel-$VERSION-papermono-full.bin" \
            -fm keep -fs keep -ff keep \
            0x0 $IMG/bootloader.bin 0x8000 $IMG/partitions.bin 0x10000 $IMG/firmware.bin
          cp $IMG/firmware.bin dist/firmware-papermono.bin
          cp $IMG/firmware.elf "dist/crossplay-scoundrel-$VERSION-papermono.elf"
          # A merged image that is not merged looks exactly like the app image.
          python3 - "dist/crossplay-scoundrel-$VERSION-papermono-full.bin" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          for off, want, what in [(0, 'e903', 'bootloader'), (0x8000, 'aa50', 'partition table'), (0x10000, 'e907', 'app')]:
              got = d[off:off + 2].hex()
              assert got == want, f'{what} at {hex(off)}: expected {want}, got {got}'
          print('full image ok')
          PY
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: papermono-firmware
          path: dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-papermono-full.bin
            dist/firmware-papermono.bin
          body: |
            CrossPlay with Scoundrel for the M5Stack PaperMono and PaperMono-Lite.

            - First install over USB: `*-papermono-full.bin` at offset 0x0.
            - Updates: Settings -> Check for updates, or `firmware-papermono.bin` on the SD card.
